<!DOCTYPE html>
<html>
<head>
    <title>Formulir Permintaan Rekam Medis</title>
</head>
<body>
    <h2>Formulir Permintaan Salinan Rekam Medis - Klinik Harapan</h2>
    <form>
        <label>Nama Pasien (Fiktif):</label><br>
        <input type="text" name="nama"><br><br>

        <label>Hubungan dengan Pasien:</label><br>
        <select name="hubungan">
            <option value="diri_sendiri">Diri Sendiri</option>
            <option value="orang_tua">Orang Tua / Wali</option>
            <option value="keluarga">Keluarga Diberi Kuasa</option>
        </select><br><br>

        <button type="submit">Kirim Permintaan</button>
    </form>
</body>
</html>
